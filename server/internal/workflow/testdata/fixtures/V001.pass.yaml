apiVersion: composer.noqodi/v1
kind: Workflow
metadata:
  id: fixture
  version: 1
  owner: tester
target:
  squad:
    name: Squad
    leader: lead
approvers:
  qa: [user:u1]
start: build-step-2
stages:
  - id: build-step-2
    type: agent
    agent: builder
    next: review
  - id: review
    type: human_gate
    approvers: qa
    on_approve: done
    on_reject: build-step-2
    max_rework: 2
  - id: done
    type: end
